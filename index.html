            --primary-color: #ffbc00;

            --vh: 1vh;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        html {
            height: 100%;
            width: 100%;
            -webkit-text-size-adjust: none;
            -ms-text-size-adjust: none;
            text-size-adjust: none;
            overflow: hidden; /* Ocultar scroll para pantalla completa */
        }
        
        body {
            height: 100vh;
            height: 100dvh; /* Usar altura dinámica del viewport */
            width: 100vw;
            margin: 0;
            padding: 0;
            background-color: #1a0f2e;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            text-align: center;
            background-image: url('https://images.unsplash.com/photo-1551334787-21e735c3c3cc?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            background-attachment: fixed;
            position: fixed; /* Fijar para pantalla completa */
            top: 0;
            left: 0;
            overflow: hidden; /* Sin scroll */
            -webkit-overflow-scrolling: touch;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(26,15,46,0.85), rgba(48,25,86,0.95));
            z-index: 1;
        }
        
        .container {
            position: fixed; /* Posición fija para pantalla completa */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centrar todo el contenido */
            overflow: hidden; /* Sin scroll interno */
        }
        
        .logo {
            width: min(85vw, 500px); /* Aumentado de 400px a 500px */
            height: min(85vw, 500px);
            margin-bottom: -30px;
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-width: 100%;
            max-height: 100%;
        }
        
        h1 {
            font-size: clamp(22px, 6vw, 32px); /* Aumentado de 18px-24px a 22px-32px */
            margin-bottom: 12px;
            margin-top: -35px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.1;
            font-weight: 800;
            flex-shrink: 0;
            width: 100%;
            max-width: 100%;
        }
        
        .superbono-img {
            max-width: min(60vw, 250px); /* Reducido de 350px a 250px */
            height: auto;
            margin: 10px auto; /* Aumentado de 8px a 10px */
            display: block;
            filter: drop-shadow(0 2px 10px rgba(102, 51, 153, 0.8));
            animation: float 3s ease-in-out infinite;
            transition: transform 0.3s ease;
        }
        
        .call-to-action {
            color: #fff;
            font-size: clamp(11px, 3vw, 15px); /* Reducido de 14px-20px a 11px-15px */
            margin-top: 10px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.7);
            background: rgba(0,0,0,0.3);
            padding: 8px 16px; /* Aumentado padding */
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
            max-width: 90%;
        }
        
        .name-form {
            margin: 15px auto; /* Aumentado de 12px a 15px */
            width: 85%;
            max-width: 380px; /* Aumentado de 320px a 380px */
            flex-shrink: 0;
        }
        
        .name-input {
            width: 100%;
            padding: 15px 22px; /* Aumentado padding */
            font-size: 18px; /* Aumentado de 16px a 18px */
            border-radius: 25px;
            border: 2px solid rgba(102, 51, 153, 0.8);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 0 15px rgba(102, 51, 153, 0.4);
            font-weight: 600;
            min-height: 52px; /* Aumentado de 45px a 52px */
            -webkit-appearance: none;
            appearance: none;
        }
        
        .name-input::placeholder {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }
        
        .name-input:focus {
            border-color: #6633cc;
            box-shadow: 0 0 20px rgba(102, 51, 153, 0.6);
            transform: scale(1.01);
        }
        
        .btn-whatsapp {
            background: linear-gradient(to bottom right, #29D366, #128C7E);
            color: white;
            padding: 15px 30px; /* Aumentado padding */
            font-size: clamp(18px, 5vw, 24px); /* Aumentado tamaño de fuente */
            border-radius: 50px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px auto; /* Aumentado margen */
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.5);
            font-weight: bold;
            transition: all 0.4s;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            width: 85%;
            max-width: 380px; /* Aumentado de 320px a 380px */
            min-height: 58px; /* Aumentado de 50px a 58px */
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            animation: pulse 1.5s infinite, float 3s ease-in-out infinite;
        }
        
        .btn-whatsapp:after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(30deg);
            animation: shineButton 3s infinite;
        }
        
        .whatsapp-icon {
            width: 32px;
            height: 32px;
            margin-right: 10px; /* Aumentado de 8px a 10px */
            flex-shrink: 0;
        }
        
        /* Animaciones - manteniendo el efecto float para ambos elementos */
        @keyframes float {
            0%, 100% { 
                transform: translateY(0px); 
            }
            50% { 
                transform: translateY(-8px); /* Movimiento suave hacia arriba */
            }
        }
        
        @keyframes pulse {
            0%, 100% { 
                transform: scale(1); 
            }
            50% { 
                transform: scale(1.02); 
            }
        }
        
        @keyframes shineButton {
            0% { left: -60%; }
            100% { left: 140%; }
        }
        
        /* Media queries específicas para pantalla completa en móviles */

            .whatsapp-icon {

        /* Para orientación horizontal - ajustes para mantener pantalla completa */

        /* Estilos específicos para dispositivos iOS - pantalla completa */
        @supports (-webkit-touch-callout: none) {
            html {

                height: -webkit-fill-available;
            }
            
            body {
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: none;
                height: -webkit-fill-available;
            }
            
            .container {
                height: -webkit-fill-available;
            }
            
            .name-input, .btn-whatsapp {
                -webkit-appearance: none;
                -webkit-border-radius: 25px;
            }

        /* Asegurar pantalla completa sin zoom */
        @media screen and (max-width: 500px) {
            html {
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%;
                text-size-adjust: 100%;
                zoom: 1;

            body {

                -webkit-transform: scale(1);
                transform: scale(1);

            * {

                box-shadow: 0 15px 40px rgba(37, 211, 102, 0.7);
                animation: float 3s ease-in-out infinite; /* Mantener la animación float */
            }
        }
        
        /* Optimizaciones adicionales para pantalla completa */
        .superbono-img:hover {
            transform: scale(1.02);

        .btn-whatsapp:active {

        }

<script>
    // Función para generar un ID único para eventos
    function generateEventId() {
        return 'event_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
    }

    // Función mejorada para obtener valores de cookies con soporte para fallbacks
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return '';
    }

    // Función para validar si una respuesta HTTP es exitosa
    function checkResponse(response) {
        if (!response.ok) {
            throw new Error(`Error HTTP: ${response.status}`);
        }
        return response.json();
    }    // Función para enviar evento a Facebook Conversions API - Actualizada con nuevo Pixel ID
    function enviarEventoFacebook() {
        try {
            // Generar un ID único para este evento específico
            const eventId = generateEventId();
            console.log('🔍 Generando evento con ID:', eventId);
            
            // Registrar el evento Lead con el pixel estándar
            fbq('track', 'Lead', {
                value: 1.00,
                currency: 'USD'
            }, {eventID: eventId}); // Usamos eventID para deduplicación
            console.log('✅ Evento Lead enviado al Pixel de Facebook con ID:', eventId);

            // Obtener fbp y fbc de cookies o localStorage con mejor fallback
            const fbp = getCookie('_fbp') || '';
            const fbc = getCookie('_fbc') || 
                      getCookie('fbclid') || 
                      new URL(window.location.href).searchParams.get('fbclid') || '';
              // Obtener URL completa para event_source_url
            const eventSourceUrl = window.location.href;              // Token de acceso actualizado para el nuevo Pixel ID
            // Token actualizado para el Pixel ID 1053009823445571
            const ACCESS_TOKEN = 'EAAR7uPgFvj8BO2WoA8r9ZCZCtL70WDOs7OaLNQAuxNFCSewnN52LbA43EGBhF0vkAUSHy0A0WGZAgIB8gD6ZAZCEQjAJmZBBZA17DK5tadY0Wf8GnhZAS2maQZAC35qgvyzTBtsbZBFUYFen8Wfphy6gsOQMG7jDOMvV9x25oZBlVi1YyJmnp7YAfamrndzvktgPgZDZD';
              // Modo de prueba - Este código debe coincidir con el que usamos en el archivo .env
            const TEST_MODE = false; // Cambiar a true para pruebas
            const TEST_EVENT_CODE = 'TEST1332'; // Código correcto para pruebas
            
            // Preparar datos para el endpoint de conversiones
            const eventData = {
                fbp: fbp,
                fbc: fbc,
                event_id: eventId, // El mismo ID usado en fbq para deduplicación
                event_name: "Lead", // Cambiado a "Lead" para coincidir con el pixel
                event_source_url: eventSourceUrl,
                user_agent: navigator.userAgent,
                event_time: Math.floor(Date.now() / 1000),
                value: 1.00,
                currency: 'USD',
                access_token: ACCESS_TOKEN
            };
            
            // Añadir test_event_code solo si estamos en modo prueba
            if (TEST_MODE) {
                eventData.test_event_code = TEST_EVENT_CODE;
            }
            
            console.log('📤 Enviando datos a API de conversiones:', eventData);
            
            // Enviar evento a través de la ruta específica para Facebook Conversion API
            return fetch('/api/facebook-conversion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(eventData)
            })
            .then(checkResponse)
            .then(data => {
                console.log('✅ Evento de conversión registrado:', data);
                
                // También enviamos al endpoint general para mantener compatibilidad
                return fetch('/api/sendEvent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        eventName: 'Contactar', // Usar "Contactar" también aquí
                        eventData: eventData
                    })
                });
            })
            .then(checkResponse)
            .then(data => {
                console.log('✅ Evento general registrado:', data);
                return true; // Indicar éxito
            })
            .catch(error => {
                console.error('❌ Error al registrar evento:', error);
                return false; // Indicar error
            });
        } catch (e) {
            console.error('❌ Error inesperado:', e);
            return Promise.resolve(false);
        }
    }

    // Función para manejar el envío del formulario
    function handleFormSubmit() {
        const userName = document.getElementById('user-name').value.trim();
        if (userName) {
            console.log('Nombre ingresado:', userName);
            
            // Guardar el nombre para usarlo en WhatsApp
            localStorage.setItem('userName', userName);
            
            // Obtener el botón para simular clic
            const whatsappBtn = document.getElementById('whatsapp-btn');
            
            // Simular clic en botón de WhatsApp
            setTimeout(() => {
                document.getElementById('whatsapp-btn').click();
            }, 300);
        }
    }
    
    // Agregar event listener al botón de WhatsApp con manejo de errores mejorado
    document.addEventListener('DOMContentLoaded', function() {
        const whatsappBtn = document.getElementById('whatsapp-btn');
        const userNameInput = document.getElementById('user-name');
        
        // Restaurar nombre si estaba guardado
        const savedName = localStorage.getItem('userName');
        if (savedName && userNameInput) {
            userNameInput.value = savedName;
        }
        
        if (whatsappBtn) {
            console.log('🔍 Botón de WhatsApp encontrado, configurando eventos');
            
            whatsappBtn.addEventListener('click', function(event) {
                event.preventDefault();
                
                const userName = document.getElementById('user-name').value.trim();
                if (!userName) {
                    document.getElementById('user-name').focus();
                    return;
                }
                
                // Guardar el nombre
                localStorage.setItem('userName', userName);
                
                console.log('🖱️ Clic detectado en botón de WhatsApp');
                
                // Enviar el evento a Facebook y manejar la navegación
                enviarEventoFacebook()
                    .then(success => {
                        console.log(`⏱️ Esperando antes de abrir enlace (estado: ${success ? 'éxito' : 'error'})`);
                        
                        // Navegar al enlace después de un breve retraso
                        setTimeout(() => {
                            console.log('➡️ Abriendo enlace...');
                            window.open(this.href, '_blank');
                        }, 300);
                    });
            });
            
            // Efecto de feedback táctil al presionar el botón en móviles
            whatsappBtn.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.98)';
            }, {passive: true});
            
            whatsappBtn.addEventListener('touchend', function() {
                this.style.transform = '';
            }, {passive: true});
        } else {
            console.error('❌ No se encontró el botón de WhatsApp con ID: whatsapp-btn');
        }
    });
    
    // Función específica para asegurar pantalla completa en móviles
    function enableFullScreen() {
        // Detectar dispositivo móvil
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        if (isMobile) {
            // Configurar viewport para pantalla completa
            const setFullScreenViewport = () => {
                const vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
                
                // Forzar altura completa
                document.documentElement.style.height = '100%';
                document.body.style.height = `${window.innerHeight}px`;
                
                // Asegurar que el contenedor ocupe toda la pantalla
                const container = document.querySelector('.container');
                if (container) {
                    container.style.height = `${window.innerHeight}px`;
                    container.style.width = `${window.innerWidth}px`;
                }
                
                // Ocultar barras de dirección en móviles
                window.scrollTo(0, 1);
                setTimeout(() => window.scrollTo(0, 0), 0);
            };
            
            // Ejecutar inmediatamente
            setFullScreenViewport();
            
            // Ejecutar en eventos
            window.addEventListener('resize', setFullScreenViewport);
            window.addEventListener('orientationchange', () => {
                setTimeout(setFullScreenViewport, 100);
            });
            
            // Prevenir scroll
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            // Prevenir zoom con pellizco
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            });
            
            document.addEventListener('gesturechange', function(e) {
                e.preventDefault();
            });
            
            document.addEventListener('gestureend', function(e) {
                e.preventDefault();
            });
        }
    }
    
    // Función para verificar que todos los elementos sean visibles en pantalla completa
    function adjustForFullScreen() {
        const container = document.querySelector('.container');
        const allElements = container.querySelectorAll('.logo, h1, .name-form, .btn-whatsapp');
        
        // Calcular altura total de todos los elementos
        let totalHeight = 0;
        allElements.forEach(el => {
            totalHeight += el.offsetHeight;
        });
        
        // Agregar espaciado estimado
        totalHeight += 60; // Márgenes y padding
        
        const availableHeight = window.innerHeight;
        
        // Si el contenido es más alto que la pantalla, reducir proporcionalmente
        if (totalHeight > availableHeight) {
            const scaleFactor = availableHeight / totalHeight * 0.9; // 90% para dar espacio
            
            allElements.forEach(el => {
                const currentSize = window.getComputedStyle(el).fontSize;
                const newSize = parseFloat(currentSize) * scaleFactor;
                
                if (el.tagName.toLowerCase() === 'h1') {
                    el.style.fontSize = `${Math.max(14, newSize)}px`;
                }
            });
            
            // Ajustar logo específicamente
            const logo = document.querySelector('.logo');
            if (logo) {
                const currentWidth = logo.offsetWidth;
                const newWidth = currentWidth * scaleFactor;
                logo.style.width = `${Math.max(150, newWidth)}px`;
                logo.style.height = `${Math.max(150, newWidth)}px`;
            }
            
            console.log('🔧 Ajustado para pantalla completa con factor:', scaleFactor);
        }
        
        // Centrar verticalmente todo el contenido
        container.style.justifyContent = 'center';
        container.style.alignItems = 'center';
    }
    
    // Event listeners para pantalla completa
    document.addEventListener('DOMContentLoaded', () => {
        enableFullScreen();
        adjustForFullScreen();
    });
    
    window.addEventListener('load', () => {
        enableFullScreen();
        adjustForFullScreen();
    });
    
    window.addEventListener('resize', () => {
        setTimeout(() => {
            enableFullScreen();
            adjustForFullScreen();
        }, 100);
    });
    
    window.addEventListener('orientationchange', () => {
        setTimeout(() => {
            enableFullScreen();
            adjustForFullScreen();
        }, 200);
    });

</script>

</body>
</html>
